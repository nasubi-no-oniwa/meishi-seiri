 if(PV){const demo=[{n:'たろう',s:41,m:0},{n:'はなこ',s:40,m:1},{n:myName(),s:40,m:1},{n:'じろう',s:40,m:2}].map((r,i)=>({...r,k:keyOf(r.s,r.m),t:i}));demo.forEach((r,i)=>{r.rk=i>0&&demo[i-1].k===r.k?demo[i-1].rk:i+1;});box.innerHTML='<table class="rank">'+zenRowH(3)+demo.map(r=>rowH(r,r.n===myName())).join('')+'</table>';return;}
 try{const since=board==='d'?(dayKey(Date.now())*86400000-32400000):0;
  const [rows,qn]=await Promise.all([loadBoard(board),zenNum(board==='d')]);const myId=(ls.get('ms_auth',null)||{}).uid;
  let h='<table class="rank">'+zenRowH(qn);h+=rows.slice(0,TOPN).map(r=>rowH(r,r.id===myId)).join('');
  if(!rows.length)h+='<tr><td></td><td colspan="2">'+t('empty')+'</td></tr>';box.innerHTML=h+'</table>';
 }catch(e){box.innerHTML='<p>'+t('rankerr')+'</p>';}}
$('rankBtn').onclick=()=>openRank('d');$('rRank').onclick=()=>openRank('d',true);
$('rankBack').onclick=()=>{if(rankFrom){show('result');}else showTitle();};

// ===== まわす =====
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const raw=Math.min(.5,Math.max(0,(now-last)/1000)),dt=Math.min(.05,raw);last=now;const ct=Math.min(.1,raw);mT+=(mode==='count'||mode==='play'?raw:ct);
 if(mode==='video')return;
 if(mode==='count')countUpdate(raw);else if(mode==='play')playUpdate(raw);else if(mode==='end')endUpdate(ct);else if(mode==='zen')zenUpdate(ct);
 if(mode==='end'||mode==='zen'){const k=sm(mT/.6);CAM.position.set(0,lerp(CAM0.y,CAM0.y+1.2,k),lerp(CAM0.z,CAM0.z+2.2,k));CAM.lookAt(0,lerp(0,1.2,k),lerp(LK0,-1.6,k));}
 if(shredT>0){shredT-=dt;SHR.position.x=SP.x+Math.sin(now*.09)*.025;SHR.position.y=Math.abs(Math.sin(now*.07))*.015;}else{SHR.position.x=SP.x;SHR.position.y=0;}
 if(mode==='play'||mode==='count')placeLabels();
 if(!window.__NR)R.render(SC,CAM);}

// ===== はじめ =====
function ogpCards(sz,list){const box=$('ogpCards');box.innerHTML='';box.style.setProperty('--cw',sz+'px');box.style.setProperty('--u',(sz/100)+'px');
 for(const [kind,x,y,rot] of list){const c=genCard(kind);c.el.style.left=x+'px';c.el.style.top=y+'px';c.el.style.transform='rotate('+rot+'deg)';box.appendChild(c.el);}}
function ogpText(n){const T=$('ogpT');T.hidden=false;if(n==null){T.innerHTML='<b>'+esc(t('ogp1'))+'</b><i>'+esc(t('ogp2'))+'</i><s>'+esc(t('ogp3'))+'</s>';return;}
 if(n==='zen'){T.innerHTML='<b>'+esc(t('ogp1'))+'</b><i style="color:#1d1d1d">'+esc(t('zenHead'))+'</i><u style="font-size:'+(lang==='ja'?40:32)+'px">'+esc(t('zenRes'))+'</u>';return;}
 const plus=String(n).endsWith('p'),k=parseInt(n,10);T.innerHTML='<b>'+esc(t('ogp1'))+'</b><i style="font-size:52px;color:#1d1d1d">'+esc(t(plus?'ogpNp':'ogpN',{n:k}))+'</i><u>'+esc(t('ttlFmt',{g:grade(k)}))+'</u>';}
if(OGP){document.body.style.width='1200px';document.body.style.height='630px';R.setPixelRatio(1);R.setSize(1200,630,false);CAM.aspect=1200/630;layout();
 CAM.fov=34;CAM.position.set(-1.2,9.2,6.6);CAM.lookAt(-1.2,0,.4);CAM.updateProjectionMatrix();HOLD.position.set(-5.4,0,2.6);SHR.position.set(5.2,0,1.2);PILE.position.set(3,0,-1.6);
 HCARDS.forEach((m,i)=>m.visible=i<10);R.render(SC,CAM);ogpCards(380,[['CL',870,215,-8],['K',930,430,7]]);
 ogpText(QS.get('n'));window.__ogp=(n,lg)=>{if(lg&&lg!==lang){lang=lg;document.documentElement.lang=lg;ogpCards(380,[['CL',870,215,-8],['K',930,430,7]]);}ogpText(n);};window.__ready=1;}
else if(ICON){R.setPixelRatio(1);R.setSize(512,512,false);CAM.aspect=1;CAM.fov=30;CAM.position.set(0,10,3);CAM.lookAt(0,0,0);CAM.updateProjectionMatrix();HOLD.visible=false;SHR.visible=false;PILE.visible=false;R.render(SC,CAM);
 lang='ja';ogpCards(400,[['C',250,215,-10],['K',262,300,8]]);window.__ready=1;}
else{resize();showTitle();requestAnimationFrame(loop);}
window.__MS={makeVideo,get mode(){return mode},get G(){return G},commit,begin,startZen,showResult,openRank,genCard,set tl(v){G.tl=v;},endScene,get cur(){return G.cur}};
